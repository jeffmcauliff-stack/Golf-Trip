<script>
  /* ============================================================
     SHARED CROSS-DEVICE SYNC  (Firebase Firestore)
     Setup once (see README.md), then everyone uses the SAME TRIP_ID.
     Until you paste a real config, the app runs on this device only
     (localStorage) and automatically upgrades to shared sync after.
     ============================================================ */
  // Your Firebase keys live in firebase-config.js (set up once) so app updates never overwrite them.
  const FIREBASE_CONFIG = (window.BC_CONFIG && window.BC_CONFIG.firebase) || {
    apiKey: "PASTE_API_KEY",
    authDomain: "PASTE_PROJECT.firebaseapp.com",
    projectId: "PASTE_PROJECT_ID",
    appId: "PASTE_APP_ID"
  };
  const TRIP_ID = (window.BC_CONFIG && window.BC_CONFIG.tripId) || "big-cedar-2026";   // same value on everyone's device
  const ADMIN_UID = (window.BC_CONFIG && window.BC_CONFIG.adminUid) || "PASTE_ADMIN_UID";   // your Firebase Auth UID — the ONLY account allowed to edit
  /* ============================================================ */

  const FIELD = { bigcedar_rounds: "rounds", bigcedar_pars: "pars", bigcedar_stakes: "stakes" };
  const CONFIGURED = !!FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("PASTE");

  if (!window.storage) { window.storage = { get: async (k) => { try { const v = localStorage.getItem(k); return v == null ? null : { key: k, value: v }; } catch (e) { return null; } }, set: async (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }, delete: async (k) => { try { localStorage.removeItem(k); return true; } catch (e) { return false; } }, list: async () => ({ keys: [] }) }; }
  const SYNC = (() => {
    if (CONFIGURED) {
      firebase.initializeApp(FIREBASE_CONFIG);
      const auth = firebase.auth();
      window.BC_AUTH = {
        isAdmin: false,
        signIn: () => {
          if (document.getElementById("bc-signin")) return;
          var w = document.createElement("div"); w.id = "bc-signin";
          w.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-start;justify-content:center;z-index:9999;padding:70px 20px;";
          w.innerHTML = '<div style="background:#FBF8F1;border-radius:14px;padding:18px;max-width:340px;width:100%;font-family:Georgia,serif;box-shadow:0 10px 40px rgba(0,0,0,0.3);">'
            + '<div style="font-size:18px;font-weight:700;color:#1B3A2F;">Admin sign-in</div>'
            + '<div style="font-size:12px;color:#6F6A5E;margin:2px 0 12px;">Enter your admin email and password.</div>'
            + '<input id="bc-email" type="email" inputmode="email" autocapitalize="none" autocomplete="username" placeholder="Email" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #D9CFBC;border-radius:8px;font-size:16px;margin-bottom:8px;">'
            + '<input id="bc-pass" type="password" autocomplete="current-password" placeholder="Password" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #D9CFBC;border-radius:8px;font-size:16px;margin-bottom:8px;">'
            + '<div id="bc-err" style="color:#B22222;font-size:12px;min-height:15px;margin-bottom:8px;"></div>'
            + '<div style="display:flex;gap:8px;"><button id="bc-go" style="flex:1;padding:11px;border:none;border-radius:8px;background:#2E5E3A;color:#fff;font-weight:700;font-size:15px;">Sign in</button>'
            + '<button id="bc-cancel" style="padding:11px 14px;border:1px solid #D9CFBC;border-radius:8px;background:#fff;color:#6F6A5E;font-size:15px;">Cancel</button></div></div>';
          document.body.appendChild(w);
          var close = function () { w.remove(); };
          w.addEventListener("click", function (e) { if (e.target === w) close(); });
          document.getElementById("bc-cancel").onclick = close;
          var go = function () { var em = document.getElementById("bc-email").value.trim(); var pw = document.getElementById("bc-pass").value; var er = document.getElementById("bc-err"); er.style.color = "#6F6A5E"; er.textContent = "Signing in..."; auth.signInWithEmailAndPassword(em, pw).then(close).catch(function (e) { er.style.color = "#B22222"; er.textContent = (e && e.message) ? e.message : String(e); }); };
          document.getElementById("bc-go").onclick = go;
          document.getElementById("bc-pass").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
          setTimeout(function () { try { document.getElementById("bc-email").focus(); } catch (e) {} }, 50);
        },
        signOut: async () => { try { await auth.signOut(); } catch (e) {} try { await auth.signInAnonymously(); } catch (e) {} }
      };
      auth.onAuthStateChanged((u) => {
        window.BC_AUTH.isAdmin = !!(u && !u.isAnonymous && u.uid === ADMIN_UID);
        window.dispatchEvent(new Event("bc-admin"));
      });
      auth.signInAnonymously().catch(function () {});   // viewers connect anonymously (read-only via rules)
      let ref = null;
      async function ensure() {
        if (ref) return ref;
        try { await firebase.firestore().enablePersistence({ synchronizeTabs: true }); } catch (e) {}
        ref = firebase.firestore().collection("trips").doc(TRIP_ID);
        return ref;
      }
      return {
        async subscribe(cb) {
          const r = await ensure();
          return r.onSnapshot(
            (snap) => cb(snap.exists ? snap.data() : {}),
            (err) => { console.error(err); cb({}); }
          );
        },
        async set(key, value) {
          const r = await ensure();
          const field = FIELD[key] || key;
          await r.set({ [field]: value, updatedAt: Date.now() }, { merge: true });
          return { key, value };
        }
      };
    }
    const read = () => ({
      rounds: localStorage.getItem("bigcedar_rounds"),
      pars: localStorage.getItem("bigcedar_pars"),
      stakes: localStorage.getItem("bigcedar_stakes")
    });
    return {
      async subscribe(cb) {
        cb(read());
        const h = () => cb(read());
        window.addEventListener("storage", h);
        return () => window.removeEventListener("storage", h);
      },
      async set(key, value) { try { localStorage.setItem(key, value); } catch (e) { return null; } return { key, value }; }
    };
  })();
</script>

const courseById = id => COURSES.find(c => c.id === id);
const DEFAULT_STAKES = {

};
function upsertRound(arr, r) {
  const i = (arr || []).findIndex(x => x.id === r.id);
  if (i >= 0) {
    const c = arr.slice();
    c[i] = r;
    return c;
  }
  return [...(arr || []), r];
}
const K_ROUNDS = "bigcedar_rounds",
  K_PARS = "bigcedar_pars",
  K_STAKES = "bigcedar_stakes",
  K_DRAFT = "bigcedar_draft";

/* ============ helpers ============ */
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => new Date(d + "T00:00:00").toLocaleDateString(undefined, {
  month: "short",
  day: "numeric",
  year: "numeric"
});
const toParStr = n => n === 0 ? "E" : n > 0 ? `+${n}` : `${n}`;
const money = n => {
  const v = Math.round(n * 100) / 100;
  return `${v < 0 ? "-$" : "$"}${Math.abs(v).toLocaleString()}`;
};
const isNum = s => s !== null && s !== undefined && s !== "" && !isNaN(s);
const getPars = (courseId, overrides) => overrides && overrides[courseId] || courseById(courseId).defaultPars;
const sumRange = (a, from, to) => a.slice(from, to).reduce((x, y) => x + y, 0);
// holes 1..N that actually count toward the round (Payne's 19th is a bonus)
const scoringHoles = courseId => courseId === "paynes" ? 18 : courseById(courseId).defaultPars.length;
const displayPar = (courseId, overrides) => sumRange(getPars(courseId, overrides), 0, scoringHoles(courseId));
const isTigerHole = (courseId, i) => courseId === "paynes" && i === 18;
function participantsOf(r) {
  return PLAYERS.filter(p => {
    if (r.holeScores) return (r.holeScores[p.name] || []).some(isNum);
    if (r.scores) return r.scores[p.name] != null;
    return false;
  }).map(p => p.name);
}
function roundTotal(r, name) {
  if (r.holeScores) {
    const sc = scoringHoles(r.courseId);
    const arr = r.holeScores[name] || [];
    let sum = 0,
      any = false;
    for (let i = 0; i < sc; i++) if (isNum(arr[i])) {
      sum += Number(arr[i]);
      any = true;
    }
    return any ? sum : null;
  }
  if (r.scores) return r.scores[name] ?? null;
  return null;
}
function roundToPar(r, name, overrides) {
  const pars = getPars(r.courseId, overrides);
  if (r.holeScores) {
    const sc = scoringHoles(r.courseId);
    const arr = r.holeScores[name] || [];
    let strokes = 0,
      par = 0,
      any = false;
    for (let i = 0; i < sc; i++) if (isNum(arr[i])) {
      strokes += Number(arr[i]);
      par += pars[i];
      any = true;
    }
    return any ? strokes - par : null;
  }
  if (r.scores && r.scores[name] != null) return r.scores[name] - displayPar(r.courseId, overrides);
  return null;
}
function roundWinner(r) {
  const t = PLAYERS.map(p => ({
    name: p.name,
    t: roundTotal(r, p.name)
  })).filter(x => x.t != null);
  if (!t.length) return null;
  const min = Math.min(...t.map(x => x.t));
  const low = t.filter(x => x.t === min);
  return low.length === 1 ? low[0].name : null;
}

/* ---- betting math ---- */
function computeSkins(r, overrides, skinValue) {
  if (!r.holeScores) return null;
  const sc = scoringHoles(r.courseId);
  const winners = [];
  let pot = 0;
  for (let i = 0; i < sc; i++) {
    const e = PLAYERS.map(p => ({
      name: p.name,
      s: r.holeScores[p.name]?.[i]
    })).filter(x => isNum(x.s)).map(x => ({
      ...x,
      s: Number(x.s)
    }));
    pot += skinValue;
    if (!e.length) continue;
    const min = Math.min(...e.map(x => x.s));
    const low = e.filter(x => x.s === min);
    if (low.length === 1) {
      winners.push({
        hole: i + 1,
        name: low[0].name,
        value: pot
      });
      pot = 0;
    }
  }
  return {
    winners,
    carry: pot
  };
}
function computeNassau(r, overrides, stakes) {
  if (!r.holeScores) return null;
  const holes = scoringHoles(r.courseId);
  const seg = (from, to, stake, label) => {
    const totals = PLAYERS.map(p => {
      let sum = 0,
        count = 0;
      for (let i = from; i < to; i++) {
        const s = r.holeScores[p.name]?.[i];
        if (isNum(s)) {
          sum += Number(s);
          count++;
        }
      }
      return {
        name: p.name,
        sum,
        count
      };
    }).filter(t => t.count > 0);
    if (!totals.length) return {
      label,
      stake,
      winner: null,
      totals: []
    };
    const min = Math.min(...totals.map(t => t.sum));
    const low = totals.filter(t => t.sum === min);
    return {
      label,
      stake,
      winner: low.length === 1 ? low[0].name : null,
      push: low.length > 1,
      totals
    };
  };
  if (holes >= 18) return [seg(0, 9, stakes.nassauFront, "Front 9"), seg(9, 18, stakes.nassauBack, "Back 9"), seg(0, 18, stakes.nassauTotal, "Overall 18")];
  return [seg(0, holes, stakes.nassauTotal, `Total ${holes}`)];
}
function computeGreenies(r, overrides, stakes) {
  const course = courseById(r.courseId);
  if (!course.championship && !course.greenies) return null;
  const pars = getPars(r.courseId, overrides);
  const sc = scoringHoles(r.courseId);
  const gRate = course.championship ? stakes.greenie != null ? stakes.greenie : 2 : stakes.greenieP3 != null ? stakes.greenieP3 : stakes.greenie != null ? stakes.greenie : 2;
  const res = [];
  pars.forEach((par, i) => {
    if (isTigerHole(r.courseId, i)) res.push({
      hole: 19,
      idx: i,
      name: r.greenies?.[i] || null,
      value: stakes.tiger,
      tiger: true
    });else if (par === 3 && i < sc) res.push({
      hole: i + 1,
      idx: i,
      name: r.greenies?.[i] || null,
      value: gRate
    });
  });
  return {
    res
  };
}

// 2v2 best-ball match play (lower team best-ball wins the hole; more holes won wins the match)
function computeMatch(r, overrides) {
  const course = courseById(r.courseId);
  const mp = course.matchPlay;
  if (!mp || !r.holeScores) return null;
  const sc = scoringHoles(r.courseId);
  let holesA = 0,
    holesB = 0,
    halved = 0;
  for (let i = 0; i < sc; i++) {
    const a = mp.teamA.map(n => r.holeScores[n]?.[i]).filter(isNum).map(Number);
    const b = mp.teamB.map(n => r.holeScores[n]?.[i]).filter(isNum).map(Number);
    if (!a.length || !b.length) continue;
    const ba = Math.min(...a),
      bb = Math.min(...b);
    if (ba < bb) holesA++;else if (bb < ba) holesB++;else halved++;
  }
  const margin = holesA - holesB;
  return {
    mp,
    holesA,
    holesB,
    halved,
    margin,
    winner: margin > 0 ? "A" : margin < 0 ? "B" : null
  };
}

// The I-70 Cup: fixed regional teams for the whole trip, regardless of daily pairings.
const I70 = {
  KC: {
    key: "KC",
    label: "Kansas City",
    players: ["Jeff", "Carson"],
    color: "#134A8E"
  },
  STL: {
    key: "STL",
    label: "St. Louis",
    players: ["Kevin", "Brian"],
    color: "#B0201F"
  },
  stake: 20
};
const I70_COURSES = ["twin", "ozarks", "buffalo", "paynes"];
function i70Cup(rounds) {
  const perRound = [];
  let kc = 0,
    stl = 0,
    halved = 0;
  rounds.forEach(r => {
    const course = courseById(r.courseId);
    if (!r.holeScores || !I70_COURSES.includes(r.courseId)) return;
    const sc = scoringHoles(r.courseId);
    let a = 0,
      b = 0,
      h = 0,
      played = 0;
    for (let i = 0; i < sc; i++) {
      const kv = I70.KC.players.map(n => r.holeScores[n]?.[i]).filter(isNum).map(Number);
      const sv = I70.STL.players.map(n => r.holeScores[n]?.[i]).filter(isNum).map(Number);
      if (!kv.length || !sv.length) continue;
      played++;
      const bk = Math.min(...kv),
        bs = Math.min(...sv);
      if (bk < bs) a++;else if (bs < bk) b++;else h++;
    }
    if (played) {
      kc += a;
      stl += b;
      halved += h;
      perRound.push({
        courseId: r.courseId,
        name: course.name,
        kc: a,
        stl: b,
        halved: h
      });
    }
  });
  const scored = new Set(perRound.map(x => x.courseId));
  const complete = perRound.length > 0 && I70_COURSES.every(id => scored.has(id));
  return {
    kc,
    stl,
    halved,
    net: kc - stl,
    perRound,
    complete
